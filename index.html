<!DOCTYPE html>
<head>
  <title>To-Do App</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <h1>To-Do App</h1>
  <div class="wrapper">
    <form id="form" class="form">
      <input id="todoField" class="todoField" type="text" placeholder="Enter your task here" autocomplete="off">
      <button id="add-button" class="add-button" type="button">Add task</button>
    </form>
    <section>
      <ul id="todoList">
      </ul>
    </section>
  </div>
</body>
